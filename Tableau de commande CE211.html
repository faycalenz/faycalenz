*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--ac);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:#fff;padding:7px 12px;border-radius:6px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 16px;white-space:nowrap;color:var(--mu)}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:16px;margin:4px 0 12px}
.b{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;color:#fff}
.rd{background:var(--rd)}.or{background:var(--or)}.gr{background:var(--gr)}.gy{background:#8a908b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:#fff}
textarea{min-height:70px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.chk input{width:auto;margin-top:4px}
.done{text-decoration:line-through;color:var(--mu)}
pre{white-space:pre-wrap;background:#fafaf7;border:1px solid var(--bd);border-radius:6px;padding:12px;font-family:inherit;line-height:1.7}
.mu{color:var(--mu);font-size:13px}
#out p,.doc p{white-space:pre-wrap;margin:6px 0}.doc{font-size:14px}.hd,.tb{width:100%;border-collapse:collapse;margin:6px 0}.hd td,.tb td,.tb th{border:1px solid #444;padding:5px;font-size:13px;vertical-align:top}.tb th{background:#eee}
.tb.sm td,.tb.sm th{font-size:11px;padding:2px 4px}

.kpi{cursor:pointer}.kpi:hover{border-color:var(--ac)}
@media print{body.pn main>*:not(#nout){display:none}header,nav,.np{display:none}body{background:#fff}}
</style>

 S.an.forEach(function(a,i){if((window.afs&&a.s!=window.afs)||(window.afg&&a.g!=window.afg))return;h+='<div class="card np"><div class="row"><b>'+(i+1)+'. '+esc(a.t)+'</b><span class="b '+(a.g=="Critique"?"rd":a.g=="Majeure"?"or":"gy")+'">'+a.g+'</span></div><div class="mu">'+esc(a.z)+' — '+a.d+' — '+esc(a.r)+' — échéance '+(a.e||"—")+' '+(a.e&&a.s!="Clôturée"?badge(a.e):"")+'</div><p>'+esc(a.a)+'</p><div class="grid"><div><label>Statut</label>'+sel(["Ouverte","En cours","Clôturée"],a.s,"S.an["+i+"].s=this.value;save();render()")+'</div><div><label>Indice d\'efficacité</label>'+sel(["À évaluer","Efficace","Partielle","Non efficace"],a.ef,"S.an["+i+"].ef=this.value;save();render()")+'</div></div><p>'+(a.fj||[]).map(function(f,j){return'<a href="#" onclick="dl('+i+','+j+');return false">📎 '+esc(f.n)+'</a>'}).join(" · ")+'</p><input type="file" multiple accept=".pdf,.msg,.eml,.png,.jpg,.jpeg,.docx" onchange="att('+i+',this)"> <button onclick="S.an.splice('+i+',1);save();render()">'+T[L].del+'</button></div>'});

async function sdir(){try{var h=await new Promise(function(r){getF("dir",r)});if(!h){alert(ui("اختر المجلد أولاً","Choisissez d'abord le dossier"));return}
 if(await h.requestPermission({mode:"readwrite"})!="granted")return;

 var sd=await h.getDirectoryHandle("pieces-jointes",{create:true});
 for(var i=0;i<S.an.length;i++)for(var f of(S.an[i].fj||[])){var b=await new Promise(function(r){getF(f.id,r)});if(!b)continue;var x=await(await sd.getFileHandle((i+1)+"_"+f.n,{create:true})).createWritable();await x.write(b);await x.close()}
 alert("OK")}catch(e){alert("Erreur : "+e.message)}}

*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--ac);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px}header small{opacity:.8;display:block;font-weight:400}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:#fff;padding:7px 12px;border-radius:6px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 16px;white-space:nowrap;color:var(--mu)}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:16px;margin:4px 0 12px}
.b{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;color:#fff}
.rd{background:var(--rd)}.or{background:var(--or)}.gr{background:var(--gr)}.gy{background:#8a908b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:#fff}
textarea{min-height:70px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.chk input{width:auto;margin-top:4px}
.done{text-decoration:line-through;color:var(--mu)}
pre{white-space:pre-wrap;background:#fafaf7;border:1px solid var(--bd);border-radius:6px;padding:12px;font-family:inherit;line-height:1.7}
.mu{color:var(--mu);font-size:13px}
#out p,.doc p{white-space:pre-wrap;margin:6px 0}.doc{font-size:14px}.hd,.tb{width:100%;border-collapse:collapse;margin:6px 0}.hd td,.tb td,.tb th{border:1px solid #444;padding:5px;font-size:13px;vertical-align:top}.tb th{background:#eee}
.tb.sm td,.tb.sm th{font-size:11px;padding:2px 4px}

.kpi{cursor:pointer}.kpi:hover{border-color:var(--ac)}
@media print{body.pn main>*:not(#nout){display:none}header,nav,.np{display:none}body{background:#fff}}
</style>

function tfCalc(mo){var p=S.tf[mo];if(!p||!p.hm||!(p.p+p.t))return null;var acc=S.hse.acc.filter(function(a){return inMo(a.date,mo)}),at=acc.filter(function(a){return+a.arret>0}).length,jr=acc.reduce(function(s,a){return s+(+a.arret||0)},0),bl=acc.length,dc=acc.filter(function(a){return a.deces=="Oui"}).length,ht=(p.p+p.t)*p.hm;if(!ht)return null;return{effP:p.p,effT:p.t,ht:ht,at:at,jr:jr,bl:bl,dc:dc,sans:bl-at,tf:Math.round(at*1e6/ht*100)/100,tg:Math.round(jr*1e3/ht*100)/100}}

 h+='<div class="card np"><h2>Paramètres TF/TG — '+moLbl(mo)+'</h2><div class="grid"><div><label>Effectif permanent</label><input type="number" id="tf_p" value="'+pp.p+'"></div><div><label>Effectif temporaire</label><input type="number" id="tf_t" value="'+pp.t+'"></div><div><label>Heures / agent / mois</label><input type="number" id="tf_hm" value="'+pp.hm+'"></div></div><br><button class="p" onclick="tfSet(\''+mo+'\')">Enregistrer</button><p class="mu" style="margin-top:8px">TF = AT arrêt × 1 000 000 / heures travaillées · TG = jours arrêt × 1 000 / heures travaillées. Donnée manquante = non calculé, jamais inventé.</p>';
 if(tf)h+='<p><b>Heures travaillées :</b> '+tf.ht+' · <b>AT avec arrêt :</b> '+tf.at+' · <b>AT sans arrêt :</b> '+tf.sans+' · <b>Jours arrêt :</b> '+tf.jr+' · <b>Blessés :</b> '+tf.bl+' · <b>Décès :</b> '+tf.dc+' · <b>TF :</b> '+tf.tf+' · <b>TG :</b> '+tf.tg+'</p>';
 else h+='<p><b>Donnée non disponible</b> — renseignez effectifs et heures pour calculer TF/TG.</p>';
 h+='</div><div class="card"><h2>Registre ('+S.hse.acc.length+')</h2><div style="overflow-x:auto"><table class="tb sm"><tr><th>Date</th><th>Nom</th><th>Fonction</th><th>Lieu</th><th>Nature</th><th>Siège</th><th>Arrêt j</th><th>Décès</th><th class="np"></th></tr>';
 S.hse.acc.forEach(function(x,i){h+='<tr><td>'+esc(x.date||"")+'</td><td>'+esc((x.nom||"")+" "+(x.prenom||""))+'</td><td>'+esc(x.fonct||"")+'</td><td>'+esc(x.lieu||"")+'</td><td>'+esc(x.nat||"")+'</td><td>'+esc(x.siege||"")+'</td><td>'+esc(x.arret)+'</td><td>'+esc(x.deces)+'</td><td class="np"><button onclick="hDel(\'acc\','+i+')">×</button></td></tr>'});
 return h+'</table></div></div>'}
